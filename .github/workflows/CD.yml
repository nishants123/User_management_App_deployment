name: App deployment using kubernetes CD

on: 
  workflow_run:
    workflows: ["User management python application CI"]
    types:
      - completed

jobs:
  Deployment_kube:

      runs-on: self-hosted

      steps:
        - name: checkout code
          uses: actions/checkout@v4

        # - name: set up kubectl        # i am using self-hosted runner which already has kubectl installed, so no need to set up kubectl
        #   uses: azure/setup-kubectl@v3
        #   with:
        #     version: 'latest'

        - name: print workflow triggered msg
          run: echo "Workflow triggered successfully"

        - name: deploy sql config file
          run: kubectl apply -f "Kubernet deployment/sql_mount_config.yml"

        - name: deploy persistent volume file
          run: kubectl apply -f "Kubernet deployment/Persistent_volume.yml"

        - name: deploy persistent volume claim file
          run: kubectl apply -f "Kubernet deployment/Persistent_volume_Claim.yml"

        - name: deploy mysql database file
          run: kubectl apply -f "Kubernet deployment/database_deploy.yml"

        - name: deploy app and db config file
          run: kubectl apply -f "Kubernet deployment/mysql-app-configmap.yml"

        - name: deploy app file
          run: kubectl apply -f "Kubernet deployment/app_deploy.yml"
          
        - name: deploy app autoscaling file
          run: kubectl apply -f "Kubernet deployment/app-autoscaling.yml"

        - name: print successfully deployment msg 
          run: echo "App deployed successfully"

        

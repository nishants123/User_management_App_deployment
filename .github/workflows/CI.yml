name: User management python application CI

on:
  push:
    branches:
      - master

jobs:
  Tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Run pytest
        run: pytest
      
      - name: print success message
        run: echo "Tests passed successfully!"


  Build_and_push_Docker_image:
    runs-on: ubuntu-latest
    needs: Tests

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t nishantsahu123/user_management_project:1.2 .
          docker push nishantsahu123/user_management_project:1.2

      - name: print success message
        run: echo "Doker image built and pushed successfully!"